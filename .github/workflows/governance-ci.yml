name: MOCHIVNST P0 Governance CI

# Bootstrap-level checks only; this workflow is NOT a writer authorization gateway.
# Do not promote these smoke checks to GOV-01..GOV-10 REMOTE_ENFORCED.
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: p0-governance-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  governance-smoke:
    name: P0 governance smoke (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - name: Checkout source (pinned SHA)
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5 / Node.js 24
        with:
          persist-credentials: false
      - name: Set up Python (pinned SHA)
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6 / Node.js 24
        with:
          python-version: ${{ matrix.python-version }}
      - name: Compile bootstrap tests
        run: python -m compileall -q tests
      - name: Run bootstrap-only tests
        run: python -m unittest discover -s tests -p 'test_*.py' -v
